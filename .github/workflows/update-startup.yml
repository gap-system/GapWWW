name: "Update GAP startup example"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # skip packages that either build slowly, or are guaranteed to fail
      GAP_PACKAGES_TO_SKIP: >-
        cddinterface
        normalizinterface
        semigroups
        xgap
        zeromqinterface

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Determine latest GAP version"
        id: release
        run: |
          version=$(jq -er '.[] | select(.isLatest) | .tagName' releases.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: "Setup latest GAP version"
        uses: gap-actions/setup-gap@v3
        with:
          # don't use "latest" input, since that depends on releases.json
          # having been updated on the LIVE website already
          gap-version: ${{ steps.release.outputs.version }}

      - name: "Install package dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf                                      \
            automake                                      \
            libcurl4-openssl-dev                          \
            libncurses-dev                                \
            libtool                                       \
            pari-gp                                       \
            pkg-config

      - name: "Build packages"
        run: |
          cd "$GAPROOT/pkg"
          shopt -s nullglob
          skipped=" ${GAP_PACKAGES_TO_SKIP,,} "
          packages=()
          for info in */PackageInfo.g; do
            package=${info%/*}
            name=${package%%-*}
            if [[ "$skipped" == *" ${name,,} "* ]]; then
              continue
            fi
            packages+=("$package")
          done
          MAKEFLAGS="-j$(nproc)" ../bin/BuildPackages.sh "${packages[@]}"

      - name: "Get startup output and update installation page"
        env:
          LC_ALL: C.UTF-8
        run: |
          # start and immediately quit GAP
          gap -r -l "$GAPROOT" -c 'quit;' > "$RUNNER_TEMP/gap-startup.txt"

          # put output in code block and add "gap>" prompt
          # don't use same file or sed will screw up
          {
            printf '```\n'
            sed 's/\r//g; s/[[:blank:]]*$//' "$RUNNER_TEMP/gap-startup.txt"
            printf 'gap>\n```\n'
          } > "$RUNNER_TEMP/gap-startup.md"

          # put output in install/index.md
          start='^<!-- BEGIN GAP STARTUP EXAMPLE -->$'
          end='^<!-- END GAP STARTUP EXAMPLE -->$'
          if ! sed -n "/$start/,/$end/p" install/index.md | grep -q "$end"; then
            echo "::error:: Cannot find where to place new GAP startup output"
            exit 1
          fi
          sed -Ei "/$start/,/$end/{
            /$start/r $RUNNER_TEMP/gap-startup.md
            /$start|$end/!d
          }" install/index.md

      - name: "Create pull request"
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/update-gap-startup
          add-paths: install/index.md
          commit-message: Update GAP startup example for ${{ steps.release.outputs.version }}
          title: Update GAP startup example for ${{ steps.release.outputs.version }}
          body: |
            Update the startup output to GAP ${{ steps.release.outputs.version }}.
