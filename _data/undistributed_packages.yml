# GAP packages that are not distributed with GAP, shown on
# /packages/undistributed/ and served as JSON at
# /packages/undistributed.json. As in the package-infos.json of the
# package distribution, each entry is keyed by the lowercase package
# name. Field names follow PackageInfo.g; all but PackageName and
# Subtitle are optional. Give PackageInfoURL where the package publishes
# one, so that PackageManager can find it.

associationschemes:
  PackageName: AssociationSchemes
  Subtitle: A GAP package for working with association schemes and homogeneous coherent configurations
  PackageWWWHome: https://jesselansdown.github.io/AssociationSchemes
  SourceRepository:
    Type: git
    URL: https://github.com/jesselansdown/AssociationSchemes
  PackageInfoURL: http://www.jesselansdown.com/AssociationSchemes/PackageInfo.g
