# GAP packages that are not distributed with GAP, shown on
# /packages/other/ and served as JSON at /packages/other.json.
# Field names follow PackageInfo.g; all but PackageName and Subtitle are
# optional. Give PackageInfoURL where the package publishes one, so that
# PackageManager can install it.

