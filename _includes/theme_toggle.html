{%- comment -%}
  Light / follow system / dark switch, wired up in head_custom.html.
{%- endcomment -%}
<div class="theme-toggle" role="group" aria-label="Color theme">
  <button type="button" class="btn-reset" data-theme="light" aria-pressed="false" title="Light">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
  <button type="button" class="btn-reset" data-theme="auto" aria-pressed="false" title="Follow system">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
  </button>
  <button type="button" class="btn-reset" data-theme="dark" aria-pressed="false" title="Dark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</div>
